[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-ai-research-assistant"
version = "0.1.0"
description = "A local multi-agent AI research assistant built with LangGraph and Ollama"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "httpx==0.28.1",
    "langchain==1.3.13",
    "langchain-core==1.4.9",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.9",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
]

[project.optional-dependencies]
dev = [
    "mypy==2.2.0",
    "pytest==9.1.1",
    "ruff==0.15.20",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_research_assistant*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
warn_unused_configs = true